  <path d="M112 62h227l72 72v70l-46 9v-56h-52c-25 0-45-20-45-45V108H112a18 18 0 0 0-18 18v198l-48 50V128c0-36 29-66 66-66Zm204 46v4h4l-4-4Z" fill="url(#resumioGradient)"/>

