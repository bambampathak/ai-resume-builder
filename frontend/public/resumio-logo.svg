<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 57 460 460" role="img" aria-labelledby="title desc">
  <title id="title">Resumio logo</title>
  <desc id="desc">A stylized document, letter R, and rising arrow representing career growth.</desc>
  <defs>
    <linearGradient id="resumioGradient" x1="88" y1="430" x2="418" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="0.48" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#c026f5"/>
    </linearGradient>
    <linearGradient id="resumioHighlight" x1="136" y1="118" x2="385" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b5cf6" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#4f46e5" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

